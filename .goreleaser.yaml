# .goreleaser.yaml
# GoReleaser v2 configuration for LNTA zero-friction Linux packaging
# See: https://goreleaser.com/customization/
project_name: lnta
version: 2
before:
  hooks:
    - sh scripts/deb/validate-inputs.sh
    - go mod tidy
    - go generate ./...
builds:
  - id: lnta
    main: ./cmd/lnta
    binary: lnta
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/sm-me-dev/lnta.Version={{.Version}}
      - -X github.com/sm-me-dev/lnta.Commit={{.Commit}}
      - -X github.com/sm-me-dev/lnta.Date={{.Date}}
    flags:
      - -trimpath
nfpms:
  - id: deb
    package_name: lnta
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
    bindir: /usr/bin
    maintainer: "LNTA Maintainers <maintainers@lnta.dev>"
    description: "Linux Natural-Language Terminal Assistant"
    license: "MIT"
    recommends:
      - bubblewrap
      - desktop-file-validate
    scripts:
      postinstall: scripts/deb/postinstall.sh
      preremove: scripts/deb/preremove.sh
      postremove: scripts/deb/postremove.sh
  - id: rpm
    package_name: lnta
    file_name_template: "{{ .PackageName }}-{{ .Version }}-1.{{ .Arch }}"
    formats:
      - rpm
    bindir: /usr/bin
    maintainer: "LNTA Maintainers <maintainers@lnta.dev>"
    description: "Linux Natural-Language Terminal Assistant"
    license: "MIT"
    recommends:
      - bubblewrap
      - desktop-file-validate
  - id: archlinux
    package_name: lnta
    file_name_template: "{{ .PackageName }}-{{ .Version }}-1-{{ .Arch }}"
    formats:
      - archlinux
    bindir: /usr/bin
    maintainer: "LNTA Maintainers <maintainers@lnta.dev>"
    description: "Linux Natural-Language Terminal Assistant"
    license: "MIT"
    recommends:
      - bubblewrap
      - desktop-file-validate
archives:
  - id: binary
    builds:
      - lnta
    format: tar.gz
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    files:
      - LICENSE*
      - README.md
checksum:
  name_template: "checksums.txt"
  algorithm: sha256
signs:
  - artifacts: checksum
    cmd: gpg
    args:
      - "--batch"
      - "--yes"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  github:
    owner: sm-me-dev
    name: lnta
  draft: true
  use_existing_draft: true
  prerelease: auto
  name_template: "v{{.Version}}"
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^Merge'
      - 'README'
  groups:
    - title: '🚀 Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: '🐛 Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: '⚡ Improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
