name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.2"

jobs:
  # Go vet - static analysis
  vet:
    name: go vet
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

  test-min-and-stable:
    name: go test (${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.27.2", "stable"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go test ./...

  # golangci-lint - comprehensive linting
  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  # Pack validation - ensure all instruction packs are valid
  packs-validate:
    name: lnta packs validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build lnta
        run: go build -o lnta ./cmd/lnta

      - name: Validate packs (strict mode)
        run: ./lnta packs validate --strict

  # Race detector tests - catch data races
  test-race:
    name: go test -race
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap desktop-file-utils shellcheck apparmor-utils

      - name: Configure unprivileged userns
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install AppArmor profile for bwrap (fixes uid map permission denied on Ubuntu 24.04+)
        run: |
          sudo mkdir -p /etc/apparmor.d
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          # bwrap AppArmor Profile
          # Allows unprivileged user namespaces for bubblewrap sandboxing
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap flags=(unconfined) {
            userns,

            # Read-only system mounts
            / r,
            /usr/** r,
            /bin/** r,
            /lib/** r,
            /lib64/** r,
            /etc/** r,
            /proc/** r,
            /sys/** r,
            /dev/** r,
            /run/** r,

            # Read-write tmpfs
            /tmp/** rw,
            /var/tmp/** rw,

            # Mask secret directories (read access only; they appear empty inside sandbox anyway)
            @{HOME}/.ssh/** r,
            @{HOME}/.gnupg/** r,
            @{HOME}/.aws/** r,
            @{HOME}/.kube/** r,
            @{HOME}/.config/lnta/** r,

            # Site-specific additions
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap || true

      - name: Run tests with race detector
        run: go test -race -v ./...

  # Build verification - ensure release build works
  build:
    name: Build verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build release binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/sm-me-dev/lnta.Version=${{ env.GO_VERSION }}" -o lnta ./cmd/lnta

      - name: Verify binary size
        run: |
          SIZE=$(stat -c%s lnta)
          echo "Binary size: $SIZE bytes"
          if [ $SIZE -gt 15000000 ]; then
            echo "Binary exceeds 15MB limit"
            exit 1
          fi
          echo "Binary size OK (< 15MB)"

  # Summary job - ensure all checks pass
  summary:
    name: Summary
    runs-on: ubuntu-24.04
    needs: [vet, lint, packs-validate, test-race, test-min-and-stable, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.vet.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.packs-validate.result }}" != "success" ] || \
             [ "${{ needs.test-race.result }}" != "success" ] || \
             [ "${{ needs.test-min-and-stable.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "Some CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
