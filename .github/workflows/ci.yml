name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.2"

jobs:
  # Go vet - static analysis
  vet:
    name: go vet
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

  test-min-and-stable:
    name: go test (${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.27.2", "stable"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go test ./...
      - name: Test APT metadata validation
        run: python3 scripts/apt/test_verify_repository.py

  # golangci-lint - comprehensive linting
  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  # Pack validation - ensure all instruction packs are valid
  packs-validate:
    name: lnta packs validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build lnta
        run: go build -o lnta ./cmd/lnta

      - name: Validate packs (strict mode)
        run: ./lnta packs validate --strict

  # Race detector tests - catch data races
  test-race:
    name: go test -race
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap desktop-file-utils shellcheck

      - name: Run tests with race detector
        run: go test -race -v ./...

  # Build verification - ensure release build works
  build:
    name: Build verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build release binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/sm-me-dev/lnta.Version=${{ env.GO_VERSION }}" -o lnta ./cmd/lnta

      - name: Verify binary size
        run: |
          SIZE=$(stat -c%s lnta)
          echo "Binary size: $SIZE bytes"
          if [ $SIZE -gt 15000000 ]; then
            echo "Binary exceeds 15MB limit"
            exit 1
          fi
          echo "Binary size OK (< 15MB)"

  deb-packaging:
    name: Debian package contents and controls
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.11.2
          args: release --snapshot --clean --skip=sign,publish
      - name: Inspect Debian package artifacts
        run: |
          shopt -s nullglob
          packages=(dist/*.deb)
          test "${#packages[@]}" -gt 0
          for package in "${packages[@]}"; do scripts/deb/verify-package.sh "$package"; done
      - name: Install GoReleaser CLI for input regression check
        # goreleaser-action runs GoReleaser for its own step; install the same
        # pinned CLI separately because this regression script invokes it later.
        run: |
          mkdir -p "$RUNNER_TEMP/goreleaser-bin"
          GOBIN="$RUNNER_TEMP/goreleaser-bin" go install github.com/goreleaser/goreleaser/v2@v2.11.2
          echo "$RUNNER_TEMP/goreleaser-bin" >> "$GITHUB_PATH"

      - name: Test missing package inputs fail visibly
        run: sh scripts/deb/test-missing-input.sh

  security-bwrap-integration:
    name: Restricted Bubblewrap integration (host gated)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check the runner's existing security policy
        id: policy
        run: |
          if ! command -v bwrap >/dev/null || ! test -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns || \
             ! grep -qx 1 /proc/sys/kernel/apparmor_restrict_unprivileged_userns || \
             ! sudo aa-status 2>/dev/null | grep -q 'bwrap-userns-restrict'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SKIPPED restricted Bubblewrap integration: runner does not expose the expected distro-owned AppArmor policy and restriction. No security setting or profile was changed."
            echo "Restricted Bubblewrap integration skipped: runner lacks the expected distro-owned policy/restriction; no host policy was changed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run restricted Bubblewrap to Landlock fallback check
        if: steps.policy.outputs.skip != 'true'
        run: |
          go build -o /tmp/lnta ./cmd/lnta
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          set +e
          output="$(HOME="$test_home" /tmp/lnta doctor --verbose 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          # doctor now exits nonzero for any failed required check (including LLM
          # checks, which cannot pass with an empty HOME). This step asserts the
          # sandbox result specifically: exit 4 is the sandbox failure code and
          # the Kernel Sandbox line must report OK.
          if [ "$status" -eq 4 ] || ! printf '%s\n' "$output" | grep -q 'Kernel Sandbox\.\.\. OK'; then
            echo "restricted runner could not establish any supported sandbox backend (doctor exit status $status)" >&2
            exit 1
          fi
          if printf '%s\n' "$output" | grep -q 'Bubblewrap unavailable; Landlock fallback operational'; then
            echo "Restricted Bubblewrap fallback was exercised successfully." >> "$GITHUB_STEP_SUMMARY"
          elif printf '%s\n' "$output" | grep -q 'Bubblewrap available and operational'; then
            echo "::notice::SKIPPED fallback assertion: distro policy is loaded but this runner's Bubblewrap probe is operational, so restriction did not block the backend."
            echo "Fallback assertion skipped: Bubblewrap remained operational under the runner's loaded distro policy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "doctor did not report an expected operational sandbox backend" >&2
            exit 1
          fi

  # Summary job - ensure all checks pass
  summary:
    name: Summary
    runs-on: ubuntu-24.04
    needs: [vet, lint, packs-validate, test-race, test-min-and-stable, build, deb-packaging, security-bwrap-integration]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.vet.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.packs-validate.result }}" != "success" ] || \
             [ "${{ needs.test-race.result }}" != "success" ] || \
             [ "${{ needs.test-min-and-stable.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.deb-packaging.result }}" != "success" ] || \
             [ "${{ needs.security-bwrap-integration.result }}" != "success" ]; then
            echo "Some CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
